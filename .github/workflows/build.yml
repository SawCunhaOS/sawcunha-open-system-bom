name: Build & Test

on:
  push:
    branches: [ '**' ]  # roda em qualquer push de branch
  pull_request:         # roda em qualquer PR, independente do target

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Sem token privilegiado: build de PR nao precisa (e nao deve) usar o PAT.
      # A publicacao de snapshot (publish-snapshot.yml) mantem o token dela.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # historico completo para git describe

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Este repo e um BOM (packaging pom, sem codigo): nada para compilar,
      # testar ou empacotar. O CI valida o modelo, roda o enforcer no verify
      # e checa vulnerabilidades nas versoes gerenciadas.
      - name: Validate pom.xml
        run: mvn -B validate

      - name: Enforce build rules
        run: mvn -B verify

      # Precisa de NVD_API_KEY (secret) para consultar a base de CVEs.
      # Sem continue-on-error: falha de vulnerabilidade quebra o build.
      - name: OWASP dependency-check
        run: mvn -B -Panalyze dependency-check:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
